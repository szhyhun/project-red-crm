# Recurring Resque jobs live here so the scheduler has one auditable source of
# truth. Times use the Rails application time zone (Pacific Time).
conversation_retention:
  cron: "15 3 * * *"
  class: "Conversations::RetentionJob"
  queue: maintenance
  description: "Delete chat messages and private chat attachments past each conversation's retention period."
aryeo_import_watchdog:
  cron: "*/5 * * * *"
  class: "Aryeo::ImportWatchdogJob"
  queue: maintenance
  description: "Fail Aryeo imports whose worker heartbeat has expired and release the connection."
